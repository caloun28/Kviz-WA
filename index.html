<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvíz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <main>
        <div class="container">
            <div class="questionHeader">
                <h2 class="questionTitle" id="questionTitle">Načítání otázky...</h2>
            </div>

            <form class="questions-form" id="questionsForm">
            </form>

            <div class="buttons">
                <button type="button" class="btn" id="prevBtn">Předchozí</button>
                <button type="button" class="btn btn-submit" id="submitBtn" style="display: none;">Odeslat</button>
                <button type="button" class="btn" id="nextBtn">Další</button>
            </div>
        </div>
    </main>
</body>

</html>
